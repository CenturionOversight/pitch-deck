<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="VOLSHI investor deck: clear infrastructure for autonomous intelligence." />
  <meta name="theme-color" content="#08090b" />
  <title>VOLSHI | Investor Deck</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://www.volshi.com/" aria-label="VOLSHI home">
      <span class="mark">VOLSHI</span>
      <span class="sub">Investor Deck</span>
    </a>
    <nav class="actions" aria-label="Deck controls">
      <a href="downloads/VOLSHI_ARCHETRON_Caveman_Pitch_Deck_v2(1).pdf" download>Download PDF</a>
      <button id="presentBtn" type="button" aria-label="Toggle full-screen presentation">Present</button>
    </nav>
  </header>

  <main class="deck-shell">
    <section class="viewer" aria-label="Pitch deck viewer">
      <button class="nav prev" id="prevBtn" type="button" aria-label="Previous page">‹</button>
      <div class="slide-frame">
        <iframe id="deckPdf"
          title="VOLSHI investor pitch deck"
          src="downloads/VOLSHI_ARCHETRON_Caveman_Pitch_Deck_v2(1).pdf#toolbar=0&navpanes=0&view=FitH"
          loading="eager"></iframe>
        <p class="fallback" id="pdfFallback" hidden>
          The embedded PDF could not be displayed.
          <a href="downloads/VOLSHI_ARCHETRON_Caveman_Pitch_Deck_v2(1).pdf">Open the investor deck PDF</a>.
        </p>
      </div>
      <button class="nav next" id="nextBtn" type="button" aria-label="Next page">›</button>
    </section>

    <section class="meta" aria-label="Deck information">
      <div>
        <p class="eyebrow">VOLSHI · AUTONOMOUS INTELLIGENCE</p>
        <h1>Clear infrastructure for autonomous intelligence.</h1>
      </div>
      <p class="page-help">Use the PDF controls, arrow keys, or the page buttons.</p>
    </section>
  </main>

  <footer class="footer">
    <span>Keyboard: ← / →, Page Up / Page Down</span>
    <a href="https://www.volshi.com/">volshi.com</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
